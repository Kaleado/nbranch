[package]
name = "nbranch"
version = "0.1.0"
edition = "2021"
description = "Independent branches and a local merge queue for agents"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
